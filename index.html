<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢斌 | 摄影艺术</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="data.js"></script>

    <style>
        /* --- 1. 核心定义 --- */
        :root { 
            --bg: #080808;           
            --panel: #111;        
            --text-main: #fff;    
            --text-sub: #666;     
            --accent: #d4af37;       
            --border: rgba(255,255,255,0.1); 
            
            --font-en-bold: 'Oswald', sans-serif;
            --font-cn: 'Noto Sans SC', sans-serif;
            --font-ui: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font-cn); 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
        }

        /* --- 2. 导航栏 --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 110px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 60px; z-index: 100;
            background: rgba(8,8,8,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .brand { 
            display: flex; flex-direction: column; justify-content: center;
            border-left: 4px solid #fff; padding-left: 15px; 
        }
        .brand-cn { font-size: 22px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 6px; letter-spacing: 2px; }
        .brand-en { font-family: var(--font-en-bold); font-size: 10px; letter-spacing: 4px; color: #888; text-transform: uppercase; }

        .nav-categories { display: flex; gap: 0; align-items: center; }
        .cat-btn {
            position: relative; padding: 0 25px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .cat-btn::after {
            content: '/'; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            color: #333; font-size: 12px; font-family: var(--font-en-bold);
        }
        .cat-btn:last-child::after { display: none; }
        .cat-btn span.cn { font-size: 15px; font-weight: 700; color: #888; transition: 0.3s; }
        .cat-btn span.en { font-family: var(--font-en-bold); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; margin-top: 4px; transition: 0.3s; }
        .cat-btn:hover span.cn, .cat-btn.active span.cn { color: #fff; transform: translateY(-2px); }

        /* --- 3. 首页时间轴 --- */
        .timeline-container {
            padding: 110px 0 0;
            max-width: 1920px; margin: 0 auto;
        }
        .year-section {
            display: flex;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
        }
        .year-label {
            width: 300px;
            flex-shrink: 0;
            padding: 60px;
            position: sticky;
            top: 110px;
            height: calc(100vh - 110px);
            font-family: var(--font-en-bold);
            font-size: 8rem;
            line-height: 0.8;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 10;
        }
        .year-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 60px 60px 100px 0;
            border-left: 1px solid #1a1a1a;
        }
        .card {
            position: relative;
            /* iOS Safari 14 及以下不支持 aspect-ratio，用 padding-bottom 撑高度 */
            height: 0;
            padding-bottom: 133.33%; /* 3:4 = 133% */
            overflow: hidden;
            background: var(--panel);
            cursor: pointer;
        }
        @supports (aspect-ratio: 3/4) {
            .card { aspect-ratio: 3/4; height: auto; padding-bottom: 0; }
        }
        .card img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .card:hover img { transform: scale(1.04); }
        .card-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0);
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 22px;
            pointer-events: none;
            transition: background 0.5s;
        }
        .card:hover .card-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
        }
        .c-title {
            font-size: 1rem; font-weight: 600; margin-bottom: 4px;
            transform: translateY(8px); opacity: 0;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        }
        .c-meta {
            font-family: var(--font-en-bold); font-size: 10px;
            color: rgba(255,255,255,0.6); letter-spacing: 2px; text-transform: uppercase;
            transform: translateY(6px); opacity: 0;
            transition: transform 0.4s 0.05s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s 0.05s;
        }
        .card:hover .c-title { transform: translateY(0); opacity: 1; }
        .card:hover .c-meta { transform: translateY(0); opacity: 1; }

        /* --- 4. 详情页 (精致留白重构) --- */
        #detail-view {
            position: fixed; inset: 0; z-index: 200;
            background: #000;
            display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #detail-view.active { transform: translateY(0); }

        .d-gallery {
            flex: 1; min-height: 0;
            background: #080808;
            display: flex; flex-direction: column;
            position: relative;
        }
        .d-main-stage {
            flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
            padding: 80px; /* 增加留白，让照片像挂在画廊里 */
            overflow: hidden;
        }
        .d-main-stage {
            position: relative;
        }
        .d-main-stage img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0; transform: scale(0.97);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .d-main-stage img.visible { opacity: 1; transform: scale(1); }
        .d-loader {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 32px; height: 2px; background: rgba(255,255,255,0.15);
            overflow: hidden;
        }
        .d-loader::after {
            content: ''; display: block; height: 100%;
            background: rgba(255,255,255,0.6);
            animation: load-sweep 1.2s ease-in-out infinite;
        }
        @keyframes load-sweep {
            0% { width: 0; margin-left: 0; }
            50% { width: 100%; margin-left: 0; }
            100% { width: 0; margin-left: 100%; }
        }
        .d-loader.hidden { display: none; }
        .d-filmstrip {
            height: 120px; width: 100%; background: #000; 
            border-top: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; gap: 20px;
            overflow-x: auto; z-index: 20;
        }
        .thumb-item {
            height: 55px; min-width: 55px; cursor: pointer; opacity: 0.3;
            object-fit: cover; border: 1px solid transparent;
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .thumb-item:hover { opacity: 0.75; transform: translateY(-3px); }
        .thumb-item.active { opacity: 1; border-color: var(--accent); transform: translateY(-3px); }

        /* --- 底部信息条 --- */
        .d-info {
            flex-shrink: 0;
            background: #000;
            border-top: 1px solid var(--border);
            overflow: hidden;
            max-height: 76px;
            transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .d-info.d-expanded { max-height: 340px; }

        .d-info-bar {
            height: 76px; display: flex; align-items: center;
            padding: 0 60px; cursor: pointer; gap: 20px;
            transition: background 0.2s;
        }
        .d-info-bar:hover { background: rgba(255,255,255,0.025); }
        .d-bar-left { flex: 1; display: flex; align-items: baseline; gap: 16px; min-width: 0; }
        .d-bar-right { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }

        .d-title-cn {
            font-size: 1.05rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.5s, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .d-title-en {
            font-family: var(--font-en-bold); font-size: 10px; color: #555;
            letter-spacing: 3px; white-space: nowrap; flex-shrink: 0;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.5s 0.08s, transform 0.5s 0.08s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .d-info.d-entered .d-title-cn { opacity: 1; transform: none; }
        .d-info.d-entered .d-title-en { opacity: 1; transform: none; }

        .d-bar-meta {
            font-family: var(--font-en-bold); font-size: 11px;
            color: #444; letter-spacing: 2px; text-transform: uppercase;
        }
        .d-expand-icon {
            width: 28px; height: 28px;
            border: 1px solid rgba(255,255,255,0.12); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #555; line-height: 1;
            transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), border-color 0.3s, color 0.3s;
            user-select: none;
        }
        .d-info.d-expanded .d-expand-icon {
            transform: rotate(45deg); border-color: rgba(255,255,255,0.3); color: #aaa;
        }
        .d-close-btn {
            position: fixed; top: 40px; right: 40px; z-index: 210;
            width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            color: #fff; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
        }
        .d-close-btn:hover { border-color: #fff; background: #fff; color: #000; transform: rotate(90deg); }

        .d-info-body {
            padding: 4px 60px 36px;
            opacity: 0; transform: translateY(6px);
            transition: opacity 0.35s 0.1s, transform 0.35s 0.1s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .d-info.d-expanded .d-info-body { opacity: 1; transform: none; }
        .d-desc { font-size: 14px; line-height: 2; color: #666; }

        /* 左右导航按钮 */
        .d-nav-btn {
            position: absolute; top: calc(50% - 60px); transform: translateY(-50%);
            width: 44px; height: 44px;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.6); font-size: 18px;
            cursor: pointer; transition: 0.25s; z-index: 15;
            display: flex; align-items: center; justify-content: center;
        }
        .d-nav-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.35); color: #fff; }
        .d-nav-prev { left: 20px; }
        .d-nav-next { right: 20px; }
        .d-nav-btn.d-hidden { opacity: 0; pointer-events: none; }

        @media (max-width: 768px) {
            /* 导航栏 */
            nav { height: auto; padding: 16px 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .brand-cn { font-size: 18px; }
            .nav-categories { width: 100%; overflow-x: auto; flex-wrap: nowrap; gap: 0; padding-bottom: 2px; }
            .cat-btn { padding: 0 16px; flex-shrink: 0; }
            .cat-btn span.cn { font-size: 13px; }

            /* 时间轴 */
            .timeline-container { padding-top: 90px; }
            .year-section { flex-direction: column; }
            .year-label {
                width: 100%; height: auto;
                position: static;
                padding: 24px 20px 8px;
                font-size: 3.5rem;
                border-left: none;
                border-bottom: 1px solid #1a1a1a;
                -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            }
            .year-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px 12px 40px;
                border-left: none;
            }
            .card-overlay {
                opacity: 1; padding: 14px;
                background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 70%);
            }
            .c-title { font-size: 1rem; transform: translateY(0); opacity: 1; }
            .c-meta { transform: translateY(0); opacity: 1; }
            .d-nav-btn { display: none; }
            .year-label { margin-top: 16px; }

            /* 详情页 — 手机全屏图片 */
            .d-gallery { height: 100vh; }
            .d-main-stage { padding: 0; height: 100vh; }
            .d-filmstrip { display: none; }
            .d-info {
                position: fixed; bottom: 0; left: 0; right: 0;
                max-height: 70vh; overflow-y: auto;
                display: block;
                border-top: none;
                background: linear-gradient(to top, rgba(0,0,0,0.97) 60%, rgba(0,0,0,0.88) 100%);
                transform: translateY(100%);
                transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 210;
            }
            .d-info.m-visible { transform: translateY(0); }
            .d-info-bar {
                height: auto; padding: 28px 24px 8px; cursor: default;
                flex-wrap: wrap; align-items: flex-start;
            }
            .d-info-bar:hover { background: none; }
            .d-bar-left { flex-direction: column; align-items: flex-start; gap: 6px; width: 100%; }
            .d-bar-right { display: none; }
            .d-title-cn { font-size: 1.5rem; white-space: normal; }
            .d-info-body { opacity: 1; transform: none; padding: 8px 24px 48px; transition: none; }
            .d-dots {
                position: fixed; bottom: 20px; left: 0; right: 0;
                display: flex; justify-content: center; gap: 6px;
                z-index: 220; pointer-events: none;
            }
            .d-dot {
                width: 5px; height: 5px; border-radius: 50%;
                background: rgba(255,255,255,0.3); transition: 0.25s;
            }
            .d-dot.active { background: #fff; width: 16px; border-radius: 3px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <div class="brand-cn">谢斌摄影</div>
            <div class="brand-en">XIE BIN PHOTOGRAPHY</div>
        </div>
        <div class="nav-categories" id="nav-categories">
            <div class="cat-btn active" onclick="filter('all', this)">
                <span class="cn">全部</span><span class="en">All Works</span>
            </div>
        </div>
    </nav>

    <div class="timeline-container" id="timeline"></div>

    <div id="detail-view">
        <div class="d-close-btn" onclick="closeDetail()">✕</div>
        <div class="d-gallery">
            <button class="d-nav-btn d-nav-prev d-hidden" id="d-prev" onclick="mNavigate(-1)">&#8592;</button>
            <button class="d-nav-btn d-nav-next d-hidden" id="d-next" onclick="mNavigate(1)">&#8594;</button>
            <div class="d-main-stage">
                <img id="d-img" src="" alt="">
                <div class="d-loader hidden" id="d-loader"></div>
            </div>
            <div class="d-filmstrip" id="d-filmstrip"></div>
        </div>
        <div id="d-dots" class="d-dots"></div>
        <div class="d-info" id="d-info-panel">
            <div class="d-info-bar" onclick="toggleDesktopInfo(event)">
                <div class="d-bar-left">
                    <div class="d-title-cn" id="d-title"></div>
                    <div class="d-title-en" id="d-title-en"></div>
                </div>
                <div class="d-bar-right">
                    <span class="d-bar-meta"><span id="d-year"></span> · <span id="d-cat"></span></span>
                    <div class="d-expand-icon">+</div>
                </div>
            </div>
            <div class="d-info-body">
                <div class="d-desc" id="d-desc"></div>
            </div>
        </div>
    </div>

    <script>
        let projects = (typeof window.portfolioData !== 'undefined') ? window.portfolioData : [];
        let currentFilter = 'all';

        function mobilePath(path) {
            return path.startsWith('images/') ? path.replace(/^images\//, 'images/mobile/') : path;
        }
        const CAT_EN = { '风光': 'Landscape', '人文': 'Life', '人像': 'Portrait', '商业': 'Commercial' };

        function buildNav() {
            const nav = document.getElementById('nav-categories');
            const cats = [...new Set(projects.map(p => p.category))].sort();
            cats.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'cat-btn';
                btn.onclick = () => filter(cat, btn);
                btn.innerHTML = `<span class="cn">${cat}</span><span class="en">${CAT_EN[cat] || cat}</span>`;
                nav.appendChild(btn);
            });
        }
        buildNav();

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            let filtered = currentFilter === 'all' ? projects : projects.filter(p => p.category === currentFilter);
            const yearsSet = new Set(filtered.map(p => p.year || '2026'));
            const sortedYears = Array.from(yearsSet).sort((a,b) => b - a);

            sortedYears.forEach(year => {
                const yearWorks = filtered.filter(p => (p.year || '2026') == year);
                const section = document.createElement('div');
                section.className = 'year-section';
                const label = document.createElement('div');
                label.className = 'year-label';
                label.innerText = year;
                const grid = document.createElement('div');
                grid.className = 'year-grid';

                yearWorks.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetail(p);
                    // 桌面端：鼠标悬停预加载原图
                    card.addEventListener('mouseenter', () => {
                        if (!card._preloaded) {
                            card._preloaded = true;
                            const pre = new Image(); pre.src = encodeURI(p.cover);
                        }
                    }, { once: false });
                    // 手机端：触摸瞬间预加载详情图，比点击早 100-200ms
                    card.addEventListener('touchstart', () => {
                        if (!card._preloaded) {
                            card._preloaded = true;
                            const pre = new Image();
                            pre.src = encodeURI(mobilePath(p.cover));
                        }
                    }, { passive: true });
                    const mob = encodeURI(mobilePath(p.cover));
                    const desk = encodeURI(p.cover);
                    card.innerHTML = `<img src="${mob}" srcset="${mob} 768w, ${desk} 2400w" sizes="(max-width: 768px) 50vw, 33vw" alt="${p.title}"><div class="card-overlay"><div class="c-title">${p.title}</div><div class="c-meta">${p.category}</div></div>`;
                    grid.appendChild(card);
                });
                section.appendChild(label);
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filter(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTimeline();
        }

        function loadMainImage(mainImg, path) {
            const loader = document.getElementById('d-loader');
            mainImg.classList.remove('visible');
            loader.classList.remove('hidden');
            const full = new Image();
            full.onload = () => {
                mainImg.src = full.src;
                loader.classList.add('hidden');
                mainImg.classList.add('visible');
            };
            full.onerror = () => { loader.classList.add('hidden'); };
            full.src = encodeURI(path);
        }

        // 详情页状态
        let mDetailImages = [];
        let mDetailIdx = 0;
        let mInfoVisible = false;
        let mSwipeReady = false;
        let dInfoExpanded = false;

        function toggleDesktopInfo(e) {
            if (isMobileView()) return;
            dInfoExpanded = !dInfoExpanded;
            document.getElementById('d-info-panel').classList.toggle('d-expanded', dInfoExpanded);
        }

        function isMobileView() { return window.innerWidth <= 768; }

        function renderDots(images, idx) {
            const dots = document.getElementById('d-dots');
            if (!dots) return;
            if (!isMobileView() || images.length <= 1) { dots.innerHTML = ''; return; }
            dots.innerHTML = images.map((_, i) =>
                `<div class="d-dot${i === idx ? ' active' : ''}"></div>`
            ).join('');
        }

        function updateNavButtons() {
            const prev = document.getElementById('d-prev');
            const next = document.getElementById('d-next');
            if (!prev || !next) return;
            const total = mDetailImages.length;
            prev.classList.toggle('d-hidden', mDetailIdx <= 0 || total <= 1);
            next.classList.toggle('d-hidden', mDetailIdx >= total - 1 || total <= 1);
        }

        function mNavigate(dir) {
            const next = mDetailIdx + dir;
            if (next < 0 || next >= mDetailImages.length) return;
            mDetailIdx = next;
            loadMainImage(document.getElementById('d-img'), mDetailImages[mDetailIdx]);
            renderDots(mDetailImages, mDetailIdx);
            updateNavButtons();
            document.querySelectorAll('.thumb-item').forEach((t, i) =>
                t.classList.toggle('active', i === mDetailIdx)
            );
        }

        function mToggleInfo() {
            mInfoVisible = !mInfoVisible;
            document.getElementById('d-info-panel').classList.toggle('m-visible', mInfoVisible);
        }

        function setupMobileSwipe() {
            if (mSwipeReady) return;
            mSwipeReady = true;
            const detail = document.getElementById('detail-view');
            let tx = 0, ty = 0, hasMoved = false;

            detail.addEventListener('touchstart', (e) => {
                tx = e.touches[0].clientX;
                ty = e.touches[0].clientY;
                hasMoved = false;
            }, { passive: true });

            detail.addEventListener('touchmove', () => { hasMoved = true; }, { passive: true });

            detail.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - tx;
                const dy = e.changedTouches[0].clientY - ty;
                const adx = Math.abs(dx), ady = Math.abs(dy);

                if (adx > ady && adx > 40) {
                    // 左右滑动切图
                    mNavigate(dx < 0 ? 1 : -1);
                } else if (dy > 80 && adx < 60) {
                    // 下滑关闭
                    closeDetail();
                } else if (!hasMoved || (adx < 10 && ady < 10)) {
                    // 点击图片区域切换信息面板
                    const info = document.querySelector('.d-info');
                    if (!info.contains(e.target)) mToggleInfo();
                }
            }, { passive: true });
        }

        function openDetail(p) {
            const mainImg = document.getElementById('d-img');
            const strip = document.getElementById('d-filmstrip');

            mDetailImages = [p.cover].concat(p.series || []);
            mDetailIdx = 0;
            mInfoVisible = false;

            loadMainImage(mainImg, mDetailImages[0]);
            document.getElementById('d-title').innerText = p.title;
            document.getElementById('d-title-en').innerText = (CAT_EN[p.category] || p.category).toUpperCase();
            document.getElementById('d-year').innerText = p.year || '2026';
            document.getElementById('d-cat').innerText = p.category;
            document.getElementById('d-desc').innerText = p.desc;

            // 桌面端胶片条
            strip.innerHTML = '';
            mDetailImages.forEach((src, index) => {
                const thumb = document.createElement('img');
                const mob = encodeURI(mobilePath(src));
                const desk = encodeURI(src);
                thumb.src = mob;
                thumb.srcset = `${mob} 768w, ${desk} 2400w`;
                thumb.sizes = '80px';
                thumb.className = 'thumb-item' + (index === 0 ? ' active' : '');
                thumb.onclick = function() {
                    mDetailIdx = index;
                    loadMainImage(mainImg, src);
                    renderDots(mDetailImages, mDetailIdx);
                    document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                strip.appendChild(thumb);
            });

            // 手机端
            document.querySelector('.d-info').classList.remove('m-visible');
            renderDots(mDetailImages, 0);
            if (isMobileView()) {
                setupMobileSwipe();
                // 后台预加载系列剩余图片（原图画质）
                mDetailImages.slice(1).forEach(src => {
                    const pre = new Image();
                    pre.src = encodeURI(src);
                });
            }

            updateNavButtons();
            // 重置信息栏展开状态
            dInfoExpanded = false;
            const dInfo = document.getElementById('d-info-panel');
            dInfo.classList.remove('d-expanded');
            document.getElementById('detail-view').classList.add('active');
            document.body.style.overflow = 'hidden';
            // 信息栏标题入场动画
            dInfo.classList.remove('d-entered');
            requestAnimationFrame(() => requestAnimationFrame(() => dInfo.classList.add('d-entered')));
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('active');
            const dInfo = document.getElementById('d-info-panel');
            dInfo.classList.remove('m-visible', 'd-expanded');
            dInfoExpanded = false;
            document.body.style.overflow = 'auto';
        }

        // 键盘方向键导航
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('detail-view').classList.contains('active')) return;
            if (e.key === 'ArrowLeft') mNavigate(-1);
            if (e.key === 'ArrowRight') mNavigate(1);
            if (e.key === 'Escape') closeDetail();
        });

        renderTimeline();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>谢斌 | 摄影艺术</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Oswald:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="data.js"></script>

    <style>
        /* --- 1. 核心定义 --- */
        :root { 
            --bg: #080808;           
            --panel: #111;        
            --text-main: #fff;    
            --text-sub: #666;     
            --accent: #d4af37;       
            --border: rgba(255,255,255,0.1); 
            
            --font-en-bold: 'Oswald', sans-serif;
            --font-cn: 'Noto Sans SC', sans-serif;
            --font-ui: 'Manrope', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: var(--font-cn); 
            overflow-x: hidden; 
            -webkit-font-smoothing: antialiased; 
        }

        /* --- 2. 导航栏 --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 110px;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 60px; z-index: 100;
            background: rgba(8,8,8,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .brand { 
            display: flex; flex-direction: column; justify-content: center;
            border-left: 4px solid #fff; padding-left: 15px; 
        }
        .brand-cn { font-size: 22px; font-weight: 900; color: #fff; line-height: 1; margin-bottom: 6px; letter-spacing: 2px; }
        .brand-en { font-family: var(--font-en-bold); font-size: 10px; letter-spacing: 4px; color: #888; text-transform: uppercase; }

        .nav-categories { display: flex; gap: 0; align-items: center; }
        .cat-btn {
            position: relative; padding: 0 25px; cursor: pointer; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .cat-btn::after {
            content: '/'; position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            color: #333; font-size: 12px; font-family: var(--font-en-bold);
        }
        .cat-btn:last-child::after { display: none; }
        .cat-btn span.cn { font-size: 15px; font-weight: 700; color: #888; transition: 0.3s; }
        .cat-btn span.en { font-family: var(--font-en-bold); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #444; margin-top: 4px; transition: 0.3s; }
        .cat-btn:hover span.cn, .cat-btn.active span.cn { color: #fff; transform: translateY(-2px); }

        /* --- 3. 首页时间轴 --- */
        .timeline-container {
            padding: 110px 0 0;
            max-width: 1920px; margin: 0 auto;
        }
        .year-section {
            display: flex;
            border-bottom: 1px solid #1a1a1a;
            position: relative;
        }
        .year-label {
            width: 300px;
            flex-shrink: 0;
            padding: 60px;
            position: sticky;
            top: 110px;
            height: calc(100vh - 110px);
            font-family: var(--font-en-bold);
            font-size: 8rem;
            line-height: 0.8;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.15);
            pointer-events: none;
            z-index: 10;
        }
        .year-grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 60px 60px 100px 0;
            border-left: 1px solid #1a1a1a;
        }
        .card {
            position: relative;
            /* iOS Safari 14 及以下不支持 aspect-ratio，用 padding-bottom 撑高度 */
            height: 0;
            padding-bottom: 133.33%; /* 3:4 = 133% */
            overflow: hidden;
            background: var(--panel);
            cursor: pointer;
        }
        @supports (aspect-ratio: 3/4) {
            .card { aspect-ratio: 3/4; height: auto; padding-bottom: 0; }
        }
        .card img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            filter: brightness(0.9);
        }
        .card:hover img { transform: scale(1.05); filter: brightness(1.1); }
        .card-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            opacity: 0; transition: 0.4s;
            display: flex; flex-direction: column; justify-content: flex-end;
        }
        .card:hover .card-overlay { opacity: 1; }
        .c-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 5px; }

        /* --- 4. 详情页 (精致留白重构) --- */
        #detail-view {
            position: fixed; inset: 0; z-index: 200;
            background: #000;
            display: grid; 
            grid-template-columns: 1fr 420px; 
            transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #detail-view.active { transform: translateY(0); }

        .d-gallery {
            height: 100vh;
            background: #080808; /* 比背景深一点的灰色 */
            display: flex; flex-direction: column;
            position: relative;
            border-right: 1px solid var(--border);
        }
        .d-main-stage {
            flex: 1; width: 100%; display: flex; align-items: center; justify-content: center;
            padding: 80px; /* 增加留白，让照片像挂在画廊里 */
            overflow: hidden;
        }
        .d-main-stage img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            box-shadow: 0 40px 100px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.05);
            transition: opacity 0.3s ease;
        }
        .d-filmstrip {
            height: 120px; width: 100%; background: #000; 
            border-top: 1px solid var(--border); 
            display: flex; align-items: center; justify-content: center; gap: 20px;
            overflow-x: auto; z-index: 20;
        }
        .thumb-item {
            height: 55px; min-width: 55px; cursor: pointer; opacity: 0.3; transition: 0.3s;
            object-fit: cover; border: 1px solid transparent;
        }
        .thumb-item.active { opacity: 1; border-color: var(--accent); }

        .d-info {
            height: 100vh; background: #000; padding: 60px 50px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
        }
        .d-close-btn {
            position: absolute; top: 40px; right: 40px;
            width: 44px; height: 44px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            color: #fff; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.3s; z-index: 10;
        }
        .d-close-btn:hover { border-color: #fff; background: #fff; color: #000; transform: rotate(90deg); }

        .d-title-cn { font-size: 3rem; font-weight: 900; line-height: 1.2; margin-bottom: 15px; }
        .d-title-en { font-family: var(--font-en-bold); font-size: 14px; color: #444; letter-spacing: 4px; margin-bottom: 50px; }
        .d-data-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding-bottom: 25px; margin-bottom: 40px; }
        .data-label { font-size: 10px; color: #666; text-transform: uppercase; margin-bottom: 8px; }
        .data-val { font-family: var(--font-en-bold); font-size: 32px; color: #fff; }
        .d-desc { font-size: 14px; line-height: 2; color: #888; text-align: justify; }

        @media (max-width: 768px) {
            /* 导航栏 */
            nav { height: auto; padding: 16px 20px; flex-direction: column; align-items: flex-start; gap: 12px; }
            .brand-cn { font-size: 18px; }
            .nav-categories { width: 100%; overflow-x: auto; flex-wrap: nowrap; gap: 0; padding-bottom: 2px; }
            .cat-btn { padding: 0 16px; flex-shrink: 0; }
            .cat-btn span.cn { font-size: 13px; }

            /* 时间轴 */
            .timeline-container { padding-top: 90px; }
            .year-section { flex-direction: column; }
            .year-label {
                width: 100%; height: auto;
                position: static;
                padding: 24px 20px 8px;
                font-size: 3.5rem;
                border-left: none;
                border-bottom: 1px solid #1a1a1a;
                -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            }
            .year-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                padding: 12px 12px 40px;
                border-left: none;
            }
            .card-overlay { opacity: 1; padding: 16px; }
            .c-title { font-size: 1rem; }

            /* 详情页 */
            #detail-view { display: block; overflow-y: auto; }
            .d-gallery { height: 55vh; }
            .d-main-stage { padding: 20px; }
            .d-filmstrip { height: 80px; gap: 10px; }
            .thumb-item { height: 40px; min-width: 40px; }
            .d-info { height: auto; padding: 30px 20px 80px; }
            .d-title-cn { font-size: 2rem; }
            .d-close-btn { top: 16px; right: 16px; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="brand">
            <div class="brand-cn">谢斌摄影</div>
            <div class="brand-en">XIE BIN PHOTOGRAPHY</div>
        </div>
        <div class="nav-categories" id="nav-categories">
            <div class="cat-btn active" onclick="filter('all', this)">
                <span class="cn">全部</span><span class="en">All Works</span>
            </div>
        </div>
    </nav>

    <div class="timeline-container" id="timeline"></div>

    <div id="detail-view">
        <div class="d-close-btn" onclick="closeDetail()">✕</div>
        <div class="d-gallery">
            <div class="d-main-stage">
                <img id="d-img" src="" alt="">
            </div>
            <div class="d-filmstrip" id="d-filmstrip"></div>
        </div>
        <div class="d-info">
            <div class="d-title-cn" id="d-title"></div>
            <div class="d-title-en">IMAGE ARCHIVE — VOL.1</div>
            <div class="d-data-row">
                <div class="data-box">
                    <div class="data-label">年份 / YEAR</div>
                    <div class="data-val" id="d-year"></div>
                </div>
                <div class="data-box" style="text-align: right;">
                    <div class="data-label">分类 / CATEGORY</div>
                    <div class="data-val" id="d-cat" style="font-size: 20px;"></div>
                </div>
            </div>
            <div class="d-desc" id="d-desc"></div>
        </div>
    </div>

    <script>
        let projects = (typeof window.portfolioData !== 'undefined') ? window.portfolioData : [];
        let currentFilter = 'all';

        const CAT_EN = { '风光': 'Landscape', '人文': 'Life', '人像': 'Portrait', '商业': 'Commercial' };

        function buildNav() {
            const nav = document.getElementById('nav-categories');
            const cats = [...new Set(projects.map(p => p.category))].sort();
            cats.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'cat-btn';
                btn.onclick = () => filter(cat, btn);
                btn.innerHTML = `<span class="cn">${cat}</span><span class="en">${CAT_EN[cat] || cat}</span>`;
                nav.appendChild(btn);
            });
        }
        buildNav();

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';
            let filtered = currentFilter === 'all' ? projects : projects.filter(p => p.category === currentFilter);
            const yearsSet = new Set(filtered.map(p => p.year || '2026'));
            const sortedYears = Array.from(yearsSet).sort((a,b) => b - a);

            sortedYears.forEach(year => {
                const yearWorks = filtered.filter(p => (p.year || '2026') == year);
                const section = document.createElement('div');
                section.className = 'year-section';
                const label = document.createElement('div');
                label.className = 'year-label';
                label.innerText = year;
                const grid = document.createElement('div');
                grid.className = 'year-grid';

                yearWorks.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetail(p);
                    // 鼠标悬停时预加载原图
                    card.addEventListener('mouseenter', () => {
                        if (!card._preloaded) {
                            card._preloaded = true;
                            const pre = new Image(); pre.src = encodeURI(p.cover);
                        }
                    }, { once: false });
                    const fullSrc = encodeURI(p.cover);
                    card.innerHTML = `<img data-src="${fullSrc}" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div class="card-overlay"><div class="c-title">${p.title}</div><div class="c-meta">${p.category}</div></div>`;
                    grid.appendChild(card);
                });
                section.appendChild(label);
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        function filter(cat, btn) {
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTimeline();
        }

        function loadMainImage(mainImg, fullSrc) {
            const thumbSrc = fullSrc.replace('images/', 'images/thumbs/');
            // 立即显示缩略图（已缓存，0延迟）
            mainImg.src = encodeURI(thumbSrc);
            mainImg.style.opacity = '1';
            // 后台加载原图，加载完淡入替换
            const full = new Image();
            full.onload = () => {
                mainImg.style.opacity = '0';
                setTimeout(() => {
                    mainImg.src = full.src;
                    mainImg.style.opacity = '1';
                }, 150);
            };
            full.src = encodeURI(fullSrc);
        }

        function openDetail(p) {
            const mainImg = document.getElementById('d-img');
            const strip = document.getElementById('d-filmstrip');
            loadMainImage(mainImg, p.cover);
            document.getElementById('d-title').innerText = p.title;
            document.getElementById('d-year').innerText = p.year || '2026';
            document.getElementById('d-cat').innerText = p.category;
            document.getElementById('d-desc').innerText = p.desc;

            let allImages = [p.cover];
            if (p.series) allImages = allImages.concat(p.series);
            strip.innerHTML = '';
            allImages.forEach((src, index) => {
                const thumb = document.createElement('img');
                thumb.src = encodeURI(src.replace('images/', 'images/thumbs/'));
                thumb.className = 'thumb-item' + (index === 0 ? ' active' : '');
                thumb.onclick = function() {
                    mainImg.classList.remove('loaded');
                    loadMainImage(mainImg, src);
                    document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                };
                strip.appendChild(thumb);
            });
            document.getElementById('detail-view').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('detail-view').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function setupLazyLoad() {
            const imgs = document.querySelectorAll('img[data-src]');
            if (!('IntersectionObserver' in window)) {
                imgs.forEach(img => { img.src = img.dataset.src; });
                return;
            }
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.removeAttribute('data-src');
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });
            imgs.forEach(img => observer.observe(img));
        }

        const _origRender = renderTimeline;
        renderTimeline = function() { _origRender(); setupLazyLoad(); };

        renderTimeline();
    </script>
</body>
</html>
